# Hand-authored — no generator writes this file. gen_configs.py and
# gen_coverage.py only read it. Edit it directly; re-running the generators
# will not update it, and will not notice when it drifts from the source.
#
# Group scopes are package hints for a human or a sweeper subagent, not
# resolvable paths — verify them against the checkout when bumping the version.
_meta:
  spark_version: "4.2.0"
  verified_at: 2026-07-19
  source_root: C:/opt/learn/spark/repos/spark
  note: >
    Scopes re-walked against v4.2.0 on 2026-07-19, in two passes.

    Correctness (does what a scope names still exist): sql/catalyst "planner" was wrong —
    SparkPlanner and SparkStrategies live in sql/core, and catalyst's execution/ package
    holds V2 logical relations plus arrow, not physical operators. DataSource V2 is split
    across both modules by design (3 logical-plan files in sql/catalyst, 87 physical exec
    files in sql/core), so the sql/core "datasources" scope claiming v2/ is correct.

    Coverage (what exists that no scope named): 73 packages were unclaimed, and a package
    no group claims can never be swept. Added five groups — catalyst "framework" (the
    trees/rules/plans/catalog/encoders substrate the analyzer, optimizer and planner all
    sit on), core "rpc-resources" and "api-bridge", sql/core "classic-api" and
    "sql-scripting" (I12 was a path topic with no group behind it) — and extended nine
    scopes. Down to 31, the remainder being plumbing (util/, errors/, test/, dsl/).
    Re-check with: python tools/spark_source_map/check_drift.py --coverage

core:
  - number: 1
    name: rdd-layer
    title: "RDD layer"
    topics: [I4, I5, I6]
    scope: "rdd/, Dependency, Partition, Partitioner, broadcast/"
    description: "RDD programming model, transformations/actions, lineage, persistence, broadcast variables"
  - number: 2
    name: execution-engine
    title: "Execution engine"
    topics: [B1, E1]
    scope: "scheduler/ (DAGScheduler, TaskScheduler, Stage), executor/, TaskContext, BarrierTaskContext"
    description: ""
  - number: 3
    name: shuffle-memory
    title: "Shuffle & memory"
    topics: [A4, E1]
    scope: "shuffle/ (SortShuffleManager, push-based shuffle), memory/ (MemoryManager, off-heap), io/compression"
    description: ""
  - number: 4
    name: storage-serializer
    title: "Storage & serialization"
    topics: [I6, E1]
    modules: [common/utils]   # StorageLevel moved out of core in Spark 4.x
    scope: "storage/ (BlockManager, BlockManagerMaster, DiskBlockManager; StorageLevel now in common/utils), serializer/ (KryoSerializer vs JavaSerializer)"
    description: ""
  - number: 5
    name: infra
    title: "Infra"
    topics: [E2, E3]
    modules: [common/utils]   # ConfigBuilder/ConfigEntry live in common/utils
    scope: "deploy/, metrics/, security/, ui/, status/ (AppStatusStore, the UI/History Server backend), internal/ (config system: ConfigBuilder, ConfigEntry), History Server configs"
    description: ""
  - number: 6
    name: rpc-resources
    title: "RPC & resource profiles"
    topics: [E1, E2]
    scope: "rpc/ (RpcEndpoint, NettyRpcEnv), network/, resource/ (ResourceProfile, ExecutorResourceRequest, ResourceAllocator)"
    description: "The control-plane RPC layer every component talks over, and the resource-profile model behind GPU and accelerator scheduling"
  - number: 7
    name: api-bridge
    title: "Language API bridge"
    topics: [I3, I4]
    scope: "api/python/ (PythonRDD, PythonRunner, Py4JServer), api/java/, api/r/"
    description: "How PySpark reaches the JVM: the Py4J gateway, the Python worker protocol, and the Java/R wrappers over the RDD API"

sql/catalyst:
  - number: 1
    name: analysis
    title: "Analysis"
    topics: [A1, B1]
    scope: "analysis/ (Analyzer, resolution rules, catalog)"
    description: "Name resolution, type coercion, and catalog lookups that turn an unresolved logical plan into a resolved one"
  - number: 2
    name: optimizer
    title: "Optimizer"
    topics: [A1, A2]
    scope: "optimizer/ (logical rules, CBO, statistics)"
    description: "Rule-based and cost-based logical optimizations applied before physical planning"
  - number: 3
    name: planner
    title: "Planner & physical operators"
    topics: [A1, A3, E1]
    scope: "planning/ (QueryPlanner, GenericStrategy, plan-matching patterns e.g. ExtractEquiJoinKeys), execution/datasources/v2/ (DataSourceV2Relation, DataSourceV2Implicits)"
    description: "The abstract planner framework and plan-matching patterns catalyst provides, plus V2 logical relations. SparkPlanner, SparkStrategies and every physical operator live in sql/core — see the sql/core query-execution group."
  - number: 4
    name: expressions
    title: "Expressions & codegen"
    topics: [E1]
    modules: [sql/core]   # WholeStageCodegenExec is a physical operator, in sql/core
    scope: "expressions/ (Expression hierarchy, codegen/ CodegenContext, CodeGenerator), WholeStageCodegenExec"
    description: "Expression evaluation, code generation, and the columnar execution model"
  - number: 5
    name: types-parser
    title: "Types & SQL parser"
    topics: [B5]
    modules: [sql/api]   # the DataType hierarchy moved to sql/api in Spark 4.x
    scope: "types/ (DataType hierarchy, StructType, DecimalType — now in sql/api), parser/ (Antlr4 grammar, AbstractSqlParser, AstBuilder), csv/, json/, xml/ (the per-format parsers and their options)"
    description: "DataType system and the SQL/DDL parser that produces unresolved logical plans"
  - number: 6
    name: framework
    title: "Catalyst framework"
    topics: [A1, E1]
    scope: "trees/ (TreeNode, TreePatterns), rules/ (Rule, RuleExecutor, RuleIdCollection), plans/ (QueryPlan, logical/ LogicalPlan, physical/ Partitioning), catalog/ (SessionCatalog, InMemoryCatalog), encoders/ (ExpressionEncoder)"
    description: "The substrate the analyzer, optimizer and planner all operate on: the immutable tree, the rule-execution engine, the plan hierarchy, the session catalog, and the encoders behind the typed Dataset API"

sql/connect:
  - number: 1
    name: client-server
    title: "Client-server protocol"
    topics: [E9]
    scope: "planner/ (SparkConnectPlanner — turns protobuf relations into a Catalyst logical plan), execution/, service/, config/, plugin/, ui/, common/ (proto definitions), client/ (SparkConnectClient), ml/ (Connect ML)"
    description: "Spark Connect protocol separating the client from the server over gRPC"
  - number: 2
    name: declarative-pipelines
    title: "Declarative Pipelines"
    topics: [A11]
    scope: "connect/pipelines/ (PipelinesHandler, DataflowGraphRegistry, PipelineEventSender); configs: spark.sql.pipelines.* in sql/catalyst"
    description: "Declarative ETL framework (Spark 4.1+) — flows, streaming tables, materialized views, spark-pipelines CLI"

# Structured Streaming is NOT here. Its execution lives in sql/core
# (execution/streaming/runtime/: StreamExecution, MicroBatchExecution,
# TriggerExecutor) and is covered by the sql/core "streaming-exec" group; its
# configs are registered in catalyst's SQLConf. This module is DStream only —
# the spark.streaming.* configs. A structured-streaming group here duplicated
# sql/core and was removed 2026-07-19.
streaming:
  - number: 1
    name: dstream
    title: "DStream (legacy)"
    topics: []
    scope: "dstream/ (DStream, InputDStream), receiver/ (Receiver, ReceiverTracker), scheduler/ (JobGenerator), rdd/, api/, ui/, StreamingContext"
    description: "Legacy RDD-based streaming model; superseded by Structured Streaming"

resource-managers/kubernetes:
  - number: 1
    name: driver-executor
    title: "Driver & executor lifecycle"
    topics: [E2]
    scope: "k8s/ (KubernetesClusterManager, ExecutorPodsAllocator, pod templates)"
    description: "Pod allocation, executor lifecycle, and driver submission on Kubernetes"
  - number: 2
    name: auth-networking
    title: "Auth & networking"
    topics: [E2]
    scope: "k8s/ (authentication, service account, node affinity, executor env)"
    description: "Kubernetes authentication, RBAC, service accounts, and network configuration"

resource-managers/yarn:
  - number: 1
    name: am-executor
    title: "AM & executor allocation"
    topics: [E2]
    scope: "yarn/ (ApplicationMaster, YarnAllocator, executor containers)"
    description: "YARN ApplicationMaster, container allocation, and executor lifecycle"

connector/kafka-0-10:
  - number: 1
    name: consumer
    title: "Kafka consumer & rate control"
    topics: [A7]
    scope: "kafka010/ (KafkaRDD, consumer cache, rate limiting, offset management)"
    description: "RDD-based Kafka connector with consumer caching and per-partition rate control"

connector/kafka-0-10-sql:
  - number: 1
    name: source-sink
    title: "Kafka source & sink"
    topics: [A7, A8]
    scope: "kafka010/ (KafkaSourceProvider, KafkaMicroBatchStream, KafkaSink), consumer/, producer/"
    description: "Structured Streaming Kafka source and sink with offset tracking and exactly-once semantics"

connector/profiler:
  - number: 1
    name: async-profiler
    title: "Async profiler integration"
    topics: [E3]
    scope: "profiler/ (ProfilerPlugin, SparkAsyncProfiler)"
    description: "Per-executor async-profiler integration for CPU and memory flamegraph collection"

sql/hive:
  - number: 1
    name: hive-metastore
    title: "Hive metastore & DDL"
    topics: [B4]
    scope: "hive/ (HiveSessionCatalog, HiveExternalCatalog, HiveClientImpl), client/ (HiveClient shim layer), execution/ (HiveTableScanExec, InsertIntoHiveTable, HiveSimpleUDF, HiveGenericUDF wrappers), orc/, security/"
    description: "Hive metastore connectivity, DDL compatibility, and SerDe/UDF bridging"

# Subsystems below define no configs of their own — Spark declares nearly every
# SQL config in sql/catalyst's SQLConf.scala regardless of where the feature
# executes. They are therefore absent from the config catalog's subsystem counts
# but are very much sweepable; sql/core in particular holds the physical
# execution for most of the book's topics.
sql/core:
  - number: 1
    name: query-execution
    title: "Query execution & planning"
    topics: [A1, I7]
    scope: "execution/ (QueryExecution, SparkPlan, SQLExecution, SparkOptimizer, ExplainUtils, WholeStageCodegenExec)"
    description: "Physical planning entry point, the plan lifecycle behind EXPLAIN, and whole-stage code generation"
  - number: 2
    name: joins-exec
    title: "Join execution"
    topics: [B7, A3]
    scope: "execution/joins/ (BroadcastHashJoinExec, SortMergeJoinExec, ShuffledHashJoinExec)"
    description: "Physical join operators and the strategy selection the planner resolves to"
  - number: 3
    name: adaptive
    title: "Adaptive query execution"
    topics: [A2, A4]
    scope: "execution/adaptive/ (AdaptiveSparkPlanExec, coalescing, skew join, dynamic broadcast)"
    description: "Runtime replanning: partition coalescing, skew splitting, and join-strategy upgrades"
  - number: 4
    name: datasources
    title: "Data sources & scans"
    topics: [B4, I10]
    scope: "execution/datasources/ (FileSourceScanExec, parquet/, v2/), DataSourceScanExec, jdbc/ (JdbcDialects, JDBCRelation), avro/ (AvroFileFormat), sources/"
    description: "File format readers/writers, predicate pushdown, column pruning, and the DSv2 API"
  - number: 5
    name: agg-window-exchange
    title: "Aggregation, window & exchange"
    topics: [B6, I2, I5]
    scope: "execution/aggregate/, execution/window/, execution/exchange/, execution/bucketing/, execution/dynamicpruning/"
    description: "Hash and sort aggregation, window operators, and the shuffle/broadcast exchange boundary"
  - number: 6
    name: python-arrow
    title: "Python & Arrow execution"
    topics: [I3, A5]
    scope: "execution/python/ (ArrowEvalPythonExec, BatchEvalPythonExec), execution/arrow/"
    description: "The PySpark UDF execution path, Arrow batch serialization, and the worker protocol"
  - number: 7
    name: streaming-exec
    title: "Streaming execution"
    topics: [A7, A8]
    scope: "execution/streaming/ (MicroBatchExecution, state store, watermark tracking), execution/streaming/runtime/ (StreamExecution, TriggerExecutor)"
    description: "Micro-batch execution loop, checkpointing, and stateful operator storage"
  - number: 8
    name: classic-api
    title: "Classic DataFrame API"
    topics: [B2, E9]
    scope: "classic/ (SparkSession, Dataset, DataFrameReader, DataFrameWriter, Catalog), artifact/, columnar/"
    description: "The classic (non-Connect) implementation of the user-facing API — the same names Spark Connect reimplements over gRPC, which is what makes the two paths worth reading side by side"
  - number: 9
    name: sql-scripting
    title: "SQL scripting"
    topics: [I12]
    scope: "scripting/ (SqlScriptingInterpreter, SqlScriptingExecution, SqlScriptingExecutionNode, SqlScriptingLocalVariableManager)"
    description: "The SQL-only procedural layer added in Spark 4.0: compound statements, local variables, control flow, and cursors"

sql/pipelines:
  - number: 1
    name: graph
    title: "Dataflow graph"
    topics: [A11]
    scope: "pipelines/graph/ (dataflow graph construction, resolution, execution ordering)"
    description: "How declarative dataset definitions become a dependency graph the engine can order and run"
  - number: 2
    name: autocdc
    title: "Auto CDC"
    topics: [A11, E8]
    scope: "pipelines/autocdc/"
    description: "Declarative SCD Type 1 upserts driven by the change-data-capture support added in Spark 4.2.0"
  - number: 3
    name: pipeline-runtime
    title: "Pipeline runtime & logging"
    topics: [A11, E3]
    scope: "pipelines/common/, pipelines/logging/, pipelines/util/, Language.scala"
    description: "Pipeline event logging, run state, and the Python/SQL language bindings"
