  type: fallback
  default: AUTH_SECRET_FILE
  default_kind: fallback
  version: 3.0.0
  doc: Path to a file that contains the authentication secret to use. Loaded by the driver. In Kubernetes
    client mode it is often useful to set a different secret path for the driver vs. the executors, since
    the driver may not be running in a pod unlike the executors. If this is set, an accompanying secret
    file must be specified for the executors. The fallback configuration allows the same path to be used
    for both the driver and the executors when running in cluster mode. File-based secret keys are only
    allowed when using Kubernetes.
