    active run for a streaming query (in the same or different SparkSessions on the same cluster) and
    this flag is true, we will stop the old streaming query run to start the new one.
  source_file: sql/catalyst/src/main/scala/org/apache/spark/sql/internal/SQLConf.scala
  source_line: 3348
