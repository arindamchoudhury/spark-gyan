  doc: During a storage-partitioned join, whether to allow to shuffle only one side. When only one side
    is KeyedPartitioning, if the conditions are met, spark will only shuffle the other side. This optimization
    will reduce the amount of data that needs to be shuffle. This config requires ${V2_BUCKETING_ENABLED.key}
    to be enabled
  source_file: sql/catalyst/src/main/scala/org/apache/spark/sql/internal/SQLConf.scala
  source_line: 2179
  prefix: spark.sql.sources
  subsystem: sql/catalyst
- key: spark.sql.sources.v2.bucketing.sorting.enabled
  type: boolean
  default: false
  default_kind: literal
  version: 4.0.0
  doc: When turned on, Spark will recognize the specific distribution reported by a V2 data source through
    SupportsReportPartitioning, and will try to avoid a shuffle if possible when sorting by those columns.
    This config requires ${V2_BUCKETING_ENABLED.key} to be enabled.
  source_file: sql/catalyst/src/main/scala/org/apache/spark/sql/internal/SQLConf.scala
  source_line: 2227
  prefix: spark.sql.sources
  subsystem: sql/catalyst
