    framework, which resolves the parsed logical plan in a single post-order traversal. It uses ExpressionResolver
    to resolve expressions and NameScope to control the visibility of names. In contrast to the current
    fixed-point framework, subsequent in-tree traversals are disallowed. Most of the fixed-point Analyzer
