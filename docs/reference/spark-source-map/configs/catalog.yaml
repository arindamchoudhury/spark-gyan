- key: spark.kubernetes.executor.rollPolicy
  type: string
  default: ExecutorRollPolicy.OUTLIER.toString
  default_kind: expr
  version: 3.3.0
  doc: 'Executor roll policy: Valid values are ID, ADD_TIME, TOTAL_GC_TIME, TOTAL_DURATION, AVERAGE_DURATION,
    FAILED_TASKS, PEAK_JVM_ONHEAP_MEMORY, PEAK_JVM_OFFHEAP_MEMORY, OUTLIER (default), and OUTLIER_NO_FALLBACK.
    When executor roll happens, Spark uses this policy to choose an executor and decommission it. The
    built-in policies are based on executor summary.ID policy chooses an executor with the smallest executor
    ID. ADD_TIME policy chooses an executor with the smallest add-time. TOTAL_GC_TIME policy chooses an
    executor with the biggest total task GC time. TOTAL_DURATION policy chooses an executor with the biggest
    total task time. AVERAGE_DURATION policy chooses an executor with the biggest average task time. FAILED_TASKS
    policy chooses an executor with the most number of failed tasks. PEAK_JVM_ONHEAP_MEMORY policy chooses
    an executor with the biggest peak JVM on-heap memory. PEAK_JVM_OFFHEAP_MEMORY policy chooses an executor
    with the biggest peak JVM off-heap memory. TOTAL_SHUFFLE_WRITE policy chooses an executor with the
    biggest total shuffle write. DISK_USED policy chooses an executor with the biggest used disk size.
    OUTLIER policy chooses an executor with outstanding statistics which is bigger thanat least two standard
    deviation from the mean in average task time, total task time, total task GC time, and the number
    of failed tasks if exists. If there is no outlier it works like TOTAL_DURATION policy. OUTLIER_NO_FALLBACK
    policy picks an outlier using the OUTLIER policy above. If there is no outlier then no executor will
    be rolled.'
  source_file: resource-managers/kubernetes/core/src/main/scala/org/apache/spark/deploy/k8s/Config.scala
  source_line: 202
  prefix: spark.kubernetes.executor
  subsystem: resource-managers/kubernetes
