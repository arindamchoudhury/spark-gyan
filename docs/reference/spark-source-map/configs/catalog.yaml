    This is memory that accounts for things like VM overheads, interned strings, other native overheads,
    etc. This tends to grow with the container size. This value defaults to 0.10 except for Kubernetes
    non-JVM jobs, which defaults to 0.40. This is done as non-JVM tasks need more non-JVM heap space and
