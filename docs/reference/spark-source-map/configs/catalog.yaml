- key: spark.sql.parser.parserDfaCacheFlushThreshold
  type: int
  default: -1
  default_kind: literal
  version: 4.1.0
  doc: When positive, release ANTLR caches after parsing a SQL query when the number of states |in the
    DFA cache exceeds the value of the config. DFA states empirically consume about |`AbstractParser.BYTES_PER_DFA_STATE`
    bytes of memory each. | |ANTLR parsers retain a DFA cache designed to speed up parsing future input.
    However, |there is no limit to how large this cache can become. Parsing large SQL statements can |lead
    to an accumulation of objects in the cache that are unlikely to be reused, causing |high GC overhead
    and eventually OOMs. | |If this config is set to a negative value, it is ignored. |If both this config
    and `spark.sql.parser.parserDfaCacheFlushRatio` are set, the |cache is flushed if either condition
    is met. |Requires `spark.sql.parser.manageParserCaches` to be true to take effect. | |Can significantly
    slow down parsing in exchange for better memory stability. |
  source_file: sql/catalyst/src/main/scala/org/apache/spark/sql/internal/SQLConf.scala
  source_line: 1445
  prefix: spark.sql.parser
  subsystem: sql/catalyst
