- key: spark.sql.sources.partitionOverwriteMode
  type: enum
  default: PartitionOverwriteMode.STATIC
  default_kind: expr
  version: 2.3.0
  doc: 'When INSERT OVERWRITE a partitioned data source table, we currently support 2 modes: static and
    dynamic. In static mode, Spark deletes all the partitions that match the partition specification(e.g.
    PARTITION(a=1,b)) in the INSERT statement, before overwriting. In dynamic mode, Spark doesn''t delete
    partitions ahead, and only overwrite those partitions that have data written into it at runtime. By
    default we use static mode to keep the same behavior of Spark prior to 2.3. Note that this config
    doesn''t affect Hive serde tables, as they are always overwritten with dynamic mode. This can also
    be set as an output option for a data source using key partitionOverwriteMode (which takes precedence
    over this setting), e.g. dataframe.write.option("partitionOverwriteMode", "dynamic").save(path).'
  source_file: sql/catalyst/src/main/scala/org/apache/spark/sql/internal/SQLConf.scala
  source_line: 5106
  prefix: spark.sql.sources
  subsystem: sql/catalyst
