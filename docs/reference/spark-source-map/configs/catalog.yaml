- key: spark.sql.parser.parserDfaCacheFlushRatio
  type: double
  default: -1.0
  default_kind: literal
  version: 4.1.0
  doc: Like `spark.sql.parser.parserDfaCacheFlushThreshold`, but uses a threshold that is a |linear function
    of the memory allocated to the driver process. Represents the percentage |of the driver memory that
    the DFA cache can consume before it is flushed. | |Estimates the memory used by the DFA cache, assuming
    each state consumes |`AbstractParser.BYTES_PER_DFA_STATE` bytes. If this value exceeds the product
    of the |driver memory with the config value (interpreted as a percentage), the cache is flushed. |
    |Active values should be in the range 0-100, and a negative value disables the feature. |If both this
    config and `spark.sql.parser.parserDfaCacheFlushThreshold` are set, the |cache is flushed if either
    condition is met. |Requires `spark.sql.parser.manageParserCaches` to be true to take effect. |
  source_file: sql/catalyst/src/main/scala/org/apache/spark/sql/internal/SQLConf.scala
  source_line: 1423
  prefix: spark.sql.parser
