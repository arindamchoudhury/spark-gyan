  doc: Enables runtime filtering for group-based and delta-based row-level operations. Data sources may
    prune entire file groups at runtime when planning a row-level operation scan. Planning-time filter
    pushdown is limited as not all expressions can be converted into data source filters and some expressions
    can only be evaluated by Spark (e.g. subqueries). Since rewriting groups or scanning unnecessary files
