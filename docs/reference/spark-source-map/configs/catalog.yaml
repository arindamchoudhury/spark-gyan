  version: 4.0.0
  doc: Whether to filter partitions when running storage-partition join. When enabled, partitions without
    matches on the other side can be omitted for scanning, if allowed by the join type. This config requires
    both ${V2_BUCKETING_ENABLED.key} and ${V2_BUCKETING_PUSH_PART_VALUES_ENABLED.key} to be enabled.
