  doc: Whether to allow storage-partitioned operations (joins, aggregates, and windows) in the case where
    the operation's keys are a subset of the partition keys of the source tables. At planning time, Spark
    will group the partitions by only those keys that are in the operation's keys. This is currently enabled
    only if ${REQUIRE_ALL_CLUSTER_KEYS_FOR_DISTRIBUTION.key} is false.
  source_file: sql/catalyst/src/main/scala/org/apache/spark/sql/internal/SQLConf.scala
  source_line: 2189
  prefix: spark.sql.sources
  subsystem: sql/catalyst
- key: spark.sql.sources.v2.bucketing.enabled
  type: boolean
  default: true
  default_kind: literal
  version: 3.3.0
  doc: Similar to ${BUCKETING_ENABLED.key}, this config is used to enable bucketing for V2 data sources.
    When turned on, Spark will recognize the specific distribution reported by a V2 data source through
    SupportsReportPartitioning, and will try to avoid shuffle if necessary.
  source_file: sql/catalyst/src/main/scala/org/apache/spark/sql/internal/SQLConf.scala
  source_line: 2144
  prefix: spark.sql.sources
  subsystem: sql/catalyst
- key: spark.sql.sources.v2.bucketing.partiallyClusteredDistribution.enabled
  type: boolean
  default: false
  default_kind: literal
  version: 3.4.0
  doc: During a storage-partitioned join, whether to allow input partitions to be partially clustered,
    when both sides of the join are of KeyedPartitioning. At planning time, Spark will pick the side with
    less data size based on table statistics, group and replicate them to match the other side. This is
    an optimization on skew join and can help to reduce data skewness when certain partitions are assigned
    large amount of data. This config requires both ${V2_BUCKETING_ENABLED.key} and ${V2_BUCKETING_PUSH_PART_VALUES_ENABLED.key}
    to be enabled
  source_file: sql/catalyst/src/main/scala/org/apache/spark/sql/internal/SQLConf.scala
  source_line: 2166
  prefix: spark.sql.sources
  subsystem: sql/catalyst
- key: spark.sql.sources.v2.bucketing.partition.filter.enabled
