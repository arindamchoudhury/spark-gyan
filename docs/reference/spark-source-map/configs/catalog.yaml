- key: spark.yarn.am.tokenConfRegex
  type: string
  default: null
  default_kind: optional
  version: 3.3.0
  doc: The value of this config is a regex expression used to grep a list of config entries from the job's
    configuration file (e.g., hdfs-site.xml) and send to RM, which uses them when renewing delegation
    tokens. A typical use case of this feature is to support delegation tokens in an environment where
    a YARN cluster needs to talk to multiple downstream HDFS clusters, where the YARN RM may not have
    configs (e.g., dfs.nameservices, dfs.ha.namenodes.*, dfs.namenode.rpc-address.*) to connect to these
    clusters. In this scenario, Spark users can specify the config value to be '^dfs.nameservices$|^dfs.namenode.rpc-address.*$|^dfs.ha.namenodes.*$'
    to parse these HDFS configs from the job's local configuration files. This config is very similar
    to 'mapreduce.job.send-token-conf'. Please check YARN-5910 for more details.
