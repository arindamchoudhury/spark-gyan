- key: spark.sql.parquet.datetimeRebaseModeInRead
  type: enum
  default: LegacyBehaviorPolicy.CORRECTED
  default_kind: expr
  version: 3.0.0
  doc: 'When LEGACY, Spark will rebase dates/timestamps from the legacy hybrid (Julian + Gregorian) calendar
    to Proleptic Gregorian calendar when reading Parquet files. When CORRECTED, Spark will not do rebase
    and read the dates/timestamps as it is. When EXCEPTION, Spark will fail the reading if it sees ancient
    dates/timestamps that are ambiguous between the two calendars. This config is only effective if the
    writer info (like Spark, Hive) of the Parquet files is unknown. This config influences on reads of
    the following parquet logical types: DATE, TIMESTAMP_MILLIS, TIMESTAMP_MICROS. The INT96 type has
    the separate config: ${PARQUET_INT96_REBASE_MODE_IN_READ.key}.'
