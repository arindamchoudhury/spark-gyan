    concurrent tasks check ensures the cluster can launch more concurrent tasks than required by a barrier
    stage on job submitted. The check can fail in case a cluster has just started and not enough executors
    have registered, so we wait for a little while and try to perform the check again. If the check fails
    more than a configured max failure times for a job then fail current job submission. Note this config
    only applies to jobs that contain one or more barrier stages, we won't perform the check on non-barrier
    jobs.
