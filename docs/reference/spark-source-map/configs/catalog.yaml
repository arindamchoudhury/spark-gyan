- key: spark.speculation.task.duration.threshold
  type: time
  default: null
  default_kind: optional
  version: 3.0.0
  doc: Task duration after which scheduler would try to speculative run the task. If provided, tasks would
    be speculatively run if current stage contains less tasks than or equal to the number of slots on
    a single executor and the task is taking longer time than the threshold. This config helps speculate
    stage with very few tasks. Regular speculation configs may also apply if the executor slots are large
    enough. E.g. tasks might be re-launched if there are enough successful runs even though the threshold
    hasn't been reached. The number of slots is computed based on the conf values of spark.executor.cores
    and spark.task.cpus minimum 1.
