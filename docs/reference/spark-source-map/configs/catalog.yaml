- key: spark.speculation.efficiency.enabled
  type: boolean
  default: true
  default_kind: literal
  version: 3.4.0
  doc: When set to true, spark will evaluate the efficiency of task processing through the stage task
    metrics or its duration, and only need to speculate the inefficient tasks. A task is inefficient when
    1)its data process rate is less than the average data process rate of all successful tasks in the
    stage multiplied by a multiplier or 2)its duration has exceeded the value of multiplying ${SPECULATION_EFFICIENCY_TASK_DURATION_FACTOR.key}
    and the time threshold (either be ${SPECULATION_MULTIPLIER.key} * successfulTaskDurations.median or
    ${SPECULATION_MIN_THRESHOLD.key}).
  source_file: core/src/main/scala/org/apache/spark/internal/config/package.scala
  source_line: 2481
  prefix: spark.speculation.efficiency
  subsystem: core
- key: spark.speculation.efficiency.longRunTaskFactor
  type: double
  default: 2.0
  default_kind: literal
  version: 3.4.0
  doc: A task will be speculated anyway as long as its duration has exceeded the value of multiplying
    the factor and the time threshold (either be ${SPECULATION_MULTIPLIER.key} * successfulTaskDurations.median
    or ${SPECULATION_MIN_THRESHOLD.key}) regardless of it's data process rate is good or not. This avoids
    missing the inefficient tasks when task slow isn't related to data process rate.
  source_file: core/src/main/scala/org/apache/spark/internal/config/package.scala
  source_line: 2469
  prefix: spark.speculation.efficiency
  subsystem: core
