    ExpressionResolver to resolve expressions and NameScope to control the visibility of names. In contrast
    to the current fixed-point framework, subsequent in-tree traversals are disallowed. Most of the fixed-point
    Analyzer code is reused in the form of specific node transformation functions (AliasResolution.resolve,
    FunctionResolution.resolveFunction, etc). This feature is currently under development.
