  prefix: spark.sql.streaming
  subsystem: sql/catalyst
- key: spark.sql.streaming.statefulOperator.allowMultiple
  type: boolean
  default: true
  default_kind: literal
  version: 3.4.0
  doc: When true, multiple stateful operators are allowed to be present in a streaming pipeline. The support
    for multiple stateful operators introduces a minor (semantically correct) change in respect to late
    record filtering - late records are detected and filtered in respect to the watermark from the previous
    microbatch instead of the current one. This is a behavior change for Spark streaming pipelines and
    we allow users to revert to the previous behavior of late record filtering (late records are detected
    and filtered by comparing with the current microbatch watermark) by setting the flag value to false.
    In this mode, only a single stateful operator will be allowed in a streaming pipeline.
  source_file: sql/catalyst/src/main/scala/org/apache/spark/sql/internal/SQLConf.scala
  source_line: 3428
  prefix: spark.sql.streaming
  subsystem: sql/catalyst
- key: spark.sql.streaming.statefulOperator.alwaysNullableOutput.enabled
  type: boolean
  default: true
  default_kind: literal
  version: 4.3.0
  doc: When true, every streaming stateful operator reports its output schema with nullable=true on all
    columns (including nested struct fields, array elements, and map values), and the state schema is
    widened at every construction site, so the existing state schema compatibility check trivially passes
    regardless of input nullability. This prevents query-optimizer decisions (e.g., PropagateEmptyRelation
    dropping a Union branch) from flipping the state schema nullability across microbatches or restarts.
    The effective value is pinned per query via the offset log at batch 0, so pre-existing queries keep
    their original behavior; only newly started queries pick this up.
  source_file: sql/catalyst/src/main/scala/org/apache/spark/sql/internal/SQLConf.scala
  source_line: 3461
  prefix: spark.sql.streaming
  subsystem: sql/catalyst
- key: spark.sql.streaming.statefulOperator.checkCorrectness.enabled
  type: boolean
  default: true
  default_kind: literal
  version: 3.1.0
  doc: When true, the stateful operators for streaming query will be checked for possible correctness
    issue due to global watermark. The correctness issue comes from queries containing stateful operation
    which can emit rows older than the current watermark plus allowed late record delay, which are "late
    rows" in downstream stateful operations and these rows can be discarded. Please refer the programming
    guide doc for more details. Once the issue is detected, Spark will throw analysis exception. When
    this config is disabled, Spark will just print warning message for users. Prior to Spark 3.1.0, the
    behavior is disabling this config.
  source_file: sql/catalyst/src/main/scala/org/apache/spark/sql/internal/SQLConf.scala
  source_line: 3413
  prefix: spark.sql.streaming
  subsystem: sql/catalyst
- key: spark.sql.streaming.statefulOperator.useStrictDistribution
  type: boolean
  default: true
  default_kind: literal
  version: 3.3.0
  doc: The purpose of this config is only compatibility; DO NOT MANUALLY CHANGE THIS!!! When true, the
    stateful operator for streaming query will use StatefulOpClusteredDistribution which guarantees stable
    state partitioning as long as the operator provides consistent grouping keys across the lifetime of
    query. When false, the stateful operator for streaming query will use ClusteredDistribution which
    is not sufficient to guarantee stable state partitioning despite the operator provides consistent
    grouping keys across the lifetime of query. This config will be set to true for new streaming queries
    to guarantee stable state partitioning, and set to false for existing streaming queries to not break
    queries which are restored from existing checkpoints. Please refer SPARK-38204 for details.
  source_file: sql/catalyst/src/main/scala/org/apache/spark/sql/internal/SQLConf.scala
  source_line: 3444
  prefix: spark.sql.streaming
  subsystem: sql/catalyst
- key: spark.sql.streaming.stopActiveRunOnRestart
  type: boolean
