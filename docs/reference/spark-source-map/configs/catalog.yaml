- key: spark.sql.sources.v2.bucketing.partitionKeyOrdering.enabled
  type: boolean
  default: false
  default_kind: literal
  version: 4.2.0
  doc: When enabled, Spark derives output ordering from the partition key expressions of a V2 data source
    that reports a KeyedPartitioning but does not report explicit ordering via SupportsReportOrdering.
    Within a single partition all rows share the same key value, so the data is trivially sorted by those
    expressions. Requires ${V2_BUCKETING_ENABLED.key} to be enabled.
  source_file: sql/catalyst/src/main/scala/org/apache/spark/sql/internal/SQLConf.scala
  source_line: 2237
  prefix: spark.sql.sources
  subsystem: sql/catalyst
- key: spark.sql.sources.v2.bucketing.preserveKeyOrderingOnCoalesce.enabled
  type: boolean
  default: false
  default_kind: literal
  version: 4.2.0
  doc: When enabled, Spark preserves sort orders over partition key expressions when GroupPartitionsExec
    coalesces multiple input partitions into one output partition. Because all merged partitions share
    the same partition key value, sort orders over those key expressions remain valid after the merge.
    This applies to both key-derived ordering (from SupportsReportOrdering) and ordering derived from
    ${V2_BUCKETING_PARTITION_KEY_ORDERING_ENABLED.key}. Requires ${V2_BUCKETING_ENABLED.key} to be enabled.
  source_file: sql/catalyst/src/main/scala/org/apache/spark/sql/internal/SQLConf.scala
  source_line: 2249
  prefix: spark.sql.sources
  subsystem: sql/catalyst
- key: spark.sql.sources.v2.bucketing.preserveOrderingOnCoalesce.enabled
  type: boolean
  default: false
  default_kind: literal
  version: 4.2.0
  doc: 'When turned on, GroupPartitionsExec will use sorted merge to preserve full ordering (as opposed
    to the key-derived ordering preserved by ${V2_BUCKETING_PRESERVE_KEY_ORDERING_ON_COALESCE_ENABLED.key})
    when coalescing multiple partitions with the same key. This allows eliminating downstream sorts when
    data is both partitioned and sorted. When this config is enabled, the effect of ${V2_BUCKETING_PRESERVE_KEY_ORDERING_ON_COALESCE_ENABLED.key}
    is fully subsumed: full ordering implies key-derived ordering. However, sorted merge uses more resources
    (priority queue, comparison overhead) than simple concatenation, especially when coalescing many partitions.
    When turned off, only key-derived ordering is preserved during coalescing. This config requires ${V2_BUCKETING_ENABLED.key}
    to be enabled.'
  source_file: sql/catalyst/src/main/scala/org/apache/spark/sql/internal/SQLConf.scala
  source_line: 2263
  prefix: spark.sql.sources
  subsystem: sql/catalyst
- key: spark.sql.sources.v2.bucketing.pushPartValues.enabled
  type: boolean
  default: true
  default_kind: literal
  version: 3.4.0
  doc: Whether to pushdown common partition values when ${V2_BUCKETING_ENABLED.key} is enabled. When turned
    on, if both sides of a join are of KeyedPartitioning and if they share compatible partition keys,
    even if they don't have the exact same partition values, Spark will calculate a superset of partition
    values and pushdown that info to group partition nodes, which will use empty partitions for the missing
    partition values on either side. This could help to eliminate unnecessary shuffles
  source_file: sql/catalyst/src/main/scala/org/apache/spark/sql/internal/SQLConf.scala
  source_line: 2154
  prefix: spark.sql.sources
  subsystem: sql/catalyst
- key: spark.sql.sources.v2.bucketing.shuffle.enabled
