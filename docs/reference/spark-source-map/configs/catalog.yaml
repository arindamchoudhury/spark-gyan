    subplans that differ only in their filter conditions and share a common join to be merged into a single
    scan. A filter attribute is only propagated through a join when it originates from the non-nullable
    (preserved) side: the left side of LeftOuter/LeftSemi/LeftAnti, the right side of RightOuter, or either
    side of Inner/Cross. FullOuter joins are never eligible. Has no effect when ${MERGE_SUBPLANS_FILTER_PROPAGATION_ENABLED.key}
