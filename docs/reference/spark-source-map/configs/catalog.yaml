- key: spark.sql.storeAssignmentPolicy
  type: enum
  default: StoreAssignmentPolicy.ANSI
  default_kind: expr
  version: 3.0.0
  doc: 'When inserting a value into a column with different data type, Spark will perform type coercion.
    Currently, we support 3 policies for the type coercion rules: ANSI, legacy and strict. With ANSI policy,
    Spark performs the type coercion as per ANSI SQL. In practice, the behavior is mostly the same as
    PostgreSQL. It disallows certain unreasonable type conversions such as converting `string` to `int`
    or `double` to `boolean`. With legacy policy, Spark allows the type coercion as long as it is a valid
    `Cast`, which is very loose. e.g. converting `string` to `int` or `double` to `boolean` is allowed.
    It is also the only behavior in Spark 2.x and it is compatible with Hive. With strict policy, Spark
    doesn''t allow any possible precision loss or data truncation in type coercion, e.g. converting `double`
    to `int` or `decimal` to `double` is not allowed.'
  source_file: sql/catalyst/src/main/scala/org/apache/spark/sql/internal/SQLConf.scala
  source_line: 5169
